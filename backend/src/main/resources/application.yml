spring:
  application:
    name: transporter-assignment
  config:
    # Local secrets live in backend/.env (git-ignored); real env vars take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transporter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

optimizer:
  # MAX_UTILIZATION_THEN_COST: use as many transporters as possible (<= maxTransporters), then cheapest.
  # COST_THEN_UTILIZATION: cheapest first, then as many transporters as possible at that cost.
  policy: ${OPTIMIZER_POLICY:MAX_UTILIZATION_THEN_COST}
  time-limit-seconds: ${OPTIMIZER_TIME_LIMIT_SECONDS:20}
  solver-workers: ${OPTIMIZER_SOLVER_WORKERS:8}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
